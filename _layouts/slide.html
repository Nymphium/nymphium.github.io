<!DOCTYPE html>
<html style="height:100%;">
  {% include head.html %}
  <body style="height:100%;">
    {% include header.html %}
    <div class="page-content" style="height:100%;">
      <div class="wrapper" lang="ja" style="height:100%;">
        <article class="post" itemscope itemtype="http://schema.org/BlogPosting">
          <header class="post-header">
            <div class="post-header-info">
              <h1 class="post-title" itemprop="name headline">{{ page.title }}</h1>
              <span class="post-meta">
                <div>
                  <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%b %-d, %Y" }}</time>
                  {%- if page.at -%}
                  <span class="at">{{page.at}}</span>
                  {%- endif -%}
                </div>

                {%- if page.tags -%}
                <p class="tags" >tag: &#123;{%- for tag in page.tags -%}
                <span class="tag">
                  <a href="{{BASE_PATH}}/tags.html#{{tag}}-ref">{{tag}}</a>
                </span>
                {%- unless forloop.last  -%}<span/>{%- endunless -%}
                  {%- endfor -%}&#125;
                </p>
                {%- endif -%}
                <a class="twitter-share-button" href="https://twitter.com/intent/tweet">Tweet</a> 
                <a href="https://b.hatena.ne.jp/entry/" class="hatena-bookmark-button" data-hatena-bookmark-layout="basic-label" data-hatena-bookmark-lang="ja" title="{{page.title}}">
                  <img src="https://b.st-hatena.com/images/v4/public/entry-button/button-only@2x.png" alt="はてなブックマークに追加" width="20" height="20" style="border: none;" />
                </a>
                <script type="text/javascript" src="https://b.st-hatena.com/js/bookmark_button.js" charset="utf-8" async="async"></script>
                </span>
            </div>
            <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
          </header>
          <aside class="slide-controller">
            <a class="download" href="{{ page.pdf }}" title="{{ page.title }}"></a><button id="fullscreen-button"/><button id="prev-page"/><button id="next-page"/>
          </aside>
          <div class="slide-container">
            <div class="progress-bar">
              <div class="progress" id="progress"></div>
            </div>
            <div id="viewerContainer">
              <div id="viewer" class="pdfViewer"></div>
            </div>
          </div>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf_viewer.js"></script>
          <script>
            (function () {
              const path = '{{ page.pdf }}';
              const prevButton = document.getElementById('prev-page');
              const nextButton = document.getElementById('next-page');
              const fullscreenButton = document.getElementById('fullscreen-button');
              const container = document.getElementById('viewerContainer');

              const eventBus = new pdfjsViewer.EventBus();
              const pdfViewer = new pdfjsViewer.PDFSinglePageViewer({
                container: container,
                eventBus: eventBus,
              });

              const onPrevPage = () => pdfViewer.previousPage();
              const onNextPage = () => pdfViewer.nextPage();

              prevButton.addEventListener('click', onPrevPage);
              nextButton.addEventListener('click', onNextPage);

              document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                  onPrevPage();
                } else if (e.key === 'ArrowRight') {
                  onNextPage();
                }
              });

              fullscreenButton.addEventListener('click', () => {
                if (container.requestFullscreen) {
                  container.requestFullscreen();
                } else if (container.mozRequestFullScreen) {
                  container.mozRequestFullScreen();
                } else if (container.webkitRequestFullscreen) {
                  container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                  container.msRequestFullscreen();
                }
              });

              pdfjsLib.getDocument(path).promise.then(pdfDoc => {
                pdfViewer.setDocument(pdfDoc);
              });

              pdfViewer.eventBus.on('pagesinit', () => {
                pdfViewer.currentScaleValue = 'page-fit';
              });

              const progressBar = document.getElementById('progress');
              const progressBarContainer = progressBar.parentElement;

              const getPageFromX = (x) => {
                const { left, width } = progressBarContainer.getBoundingClientRect();
                const page = Math.round(((x - left) / width) * (pdfViewer.pagesCount - 1)) + 1;
                return Math.max(1, Math.min(page, pdfViewer.pagesCount));
              };

              progressBarContainer.addEventListener('click', (e) => {
                pdfViewer.currentPageNumber = getPageFromX(e.clientX);
              });

              let isDragging = false;
              progressBarContainer.addEventListener('mousedown', () => isDragging = true);
              progressBarContainer.addEventListener('mouseup', () => isDragging = false);
              progressBarContainer.addEventListener('mouseleave', () => isDragging = false);
              progressBarContainer.addEventListener('mousemove', (e) => {
                if (isDragging) {
                  pdfViewer.currentPageNumber = getPageFromX(e.clientX);
                }
              });

              document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                  if (window.screen.width > window.screen.height) {
                    pdfViewer.currentScaleValue = 'page-height';
                  } else {
                    pdfViewer.currentScaleValue = 'page-width';
                  }
                } else {
                  pdfViewer.currentScaleValue = 'page-fit';
                }
              });

              const article = document.querySelector('.post');
              const setViewerWidth = () => {
                container.style.width = `${article.clientWidth}px`;
              };
              setViewerWidth();
              window.addEventListener('resize', setViewerWidth);

              pdfViewer.eventBus.on('pagechanging', (e) => {
                // pageNumSpan.textContent = `${e.pageNumber} / ${pdfViewer.pagesCount}`;
                const progress = ((e.pageNumber - 1) / (pdfViewer.pagesCount - 1)) * 100;
                progressBar.style.width = `${progress}%`;
              });

              pdfViewer.eventBus.on('pagerendered', () => {
                const links = document.querySelectorAll('.page .annotationLayer a');
                links.forEach(link => {
                  if (link.href.startsWith('http')) {
                    link.target = '_blank';
                    link.rel = 'noopener';
                  }
                });
              });
            })();
          </script>
        </article>
      </div>
    </div>
  </body>
</html>
