name: "Test"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - labeled

  push:
    branches:
      - source

  # Dispatched on a PR head branch by retest-prs to test it merged with the latest source.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !contains('ref/heads/source', github.ref) }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
      - name: Merge latest source
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin source:refs/remotes/origin/source
          git -c user.name=ci -c user.email=ci@localhost merge --no-edit origin/source
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0
      - uses: cachix/cachix-action@v17
        with:
          name: blog-ci
          authToken: "${{ secrets.CACHIX_TOKEN }}"

      - uses: actions/cache@v6.1.0
        with:
          path: |
            .jekyll-cache
            twicache
            twicard_cache
          key: ${{ runner.os }}-contents-cache-2

      - uses: nicknovitski/nix-develop@v1

      - name: Check build
        run: |
          rake build

      - name: Check format
        run: |
          nix fmt . && git diff --exit-code
          actionlint

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site

  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/source'
    needs: tests
    environment:
      name: github-pages
      url: "https://nymphium.github.io"
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
      - name: Upload static files as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Required check "tests" is non-strict, so re-run it against the new base for open PRs.
  # A merge that lands before the re-run starts is caught only by the post-merge run (which gates
  # publish); a merge queue closes that gap but is unavailable on user-owned repos.
  retest-prs:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/source'
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Dispatch tests on open PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --base source --state open \
            --json headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | .headRefName' |
            while IFS= read -r ref; do
              gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$ref" ||
                echo "::warning::failed to dispatch tests on $ref"
            done
