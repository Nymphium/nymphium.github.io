name: "Visual Regression"

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths-ignore:
      - "_posts/**"
      - "about/**"
      - "pdf/**"
      - "pictures/**"
      - "src/**"
      - "**/*.nix"
      - ".github/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        viewport: [mobile, tablet, desktop]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0
      - uses: cachix/cachix-action@v16
        with:
          name: blog-ci
          authToken: "${{ secrets.CACHIX_TOKEN }}"

      - uses: actions/cache@v5
        with:
          path: |
            .jekyll-cache
            twicache
            twicard_cache
          key: ${{ runner.os }}-contents-cache-2

      - uses: nicknovitski/nix-develop@v1

      - name: Serve local site
        run: |
          rake preview &
          timeout 30 bash -c 'until curl -sf http://localhost:4000 > /dev/null; do sleep 1; done'

      - name: Screenshot local
        run: |
          nix run .#visual-screenshots -- http://localhost:4000 test/visual/screenshots/local ${{ matrix.viewport }}
          nix run .#visual-optimize -- test/visual/screenshots/local

      - name: Screenshot production
        run: |
          nix run .#visual-screenshots -- https://nymphium.github.io test/visual/screenshots/production ${{ matrix.viewport }}
          nix run .#visual-optimize -- test/visual/screenshots/production

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.viewport }}
          path: test/visual/screenshots/

  report:
    needs: screenshot
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0
      - uses: cachix/cachix-action@v16
        with:
          name: blog-ci
          authToken: "${{ secrets.CACHIX_TOKEN }}"

      - uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: test/visual/screenshots
          merge-multiple: true

      - name: Compare screenshots
        id: compare
        continue-on-error: true
        run: |
          {
            echo "## Visual Regression Report"
            echo ""
            nix run .#visual-compare -- \
              test/visual/screenshots/production \
              test/visual/screenshots/local \
              test/visual/screenshots/diff
          } > test/visual/report.md

      - name: Optimize diff images
        if: always()
        run: nix run .#visual-optimize -- test/visual/screenshots/diff

      - name: Build diff viewer HTML
        if: always()
        run: |
          cat > test/visual/diff-report.html <<'HEADER'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>Visual Regression Diff</title>
          <style>
          body{font-family:system-ui;max-width:1400px;margin:0 auto;padding:20px;background:#f6f8fa}
          h1{border-bottom:2px solid #d0d7de;padding-bottom:8px}
          .controls{display:flex;align-items:center;gap:12px;margin-bottom:16px}
          select{padding:6px 12px;border:1px solid #d0d7de;border-radius:6px;font-size:14px;background:#fff}
          nav{display:flex;gap:8px;flex-wrap:wrap}
          nav a{padding:6px 12px;border:1px solid #d0d7de;border-radius:6px;text-decoration:none;color:#0969da;background:#fff;cursor:pointer}
          nav a.active{background:#0969da;color:#fff}
          .panel{display:none}
          .panel.active{display:block}
          .panel h2{margin-top:0}
          .imgs{display:flex;gap:8px;overflow-x:auto}
          .imgs figure{margin:0;flex:1;min-width:0}
          .imgs figcaption{font-weight:600;text-align:center;padding:4px 0}
          .imgs img{max-width:100%;border:1px solid #d0d7de;display:block}
          </style></head><body>
          <h1>Visual Regression Diff</h1>
          <div class="controls">
          <select id="ps" onchange="selectPage(this.value)">
          HEADER
          # Populate page dropdown
          for page_dir in test/visual/screenshots/diff/*/; do
            [ -d "$page_dir" ] || continue
            page="$(basename "$page_dir")"
            echo "<option value='${page}'>${page}</option>" >> test/visual/diff-report.html
          done
          echo "</select><nav id='vt'></nav></div>" >> test/visual/diff-report.html
          # Generate panels
          for page_dir in test/visual/screenshots/diff/*/; do
            [ -d "$page_dir" ] || continue
            page="$(basename "$page_dir")"
            for diff_img in "$page_dir"*.png; do
              [ -f "$diff_img" ] || continue
              viewport="$(basename "$diff_img" .png)"
              prod="test/visual/screenshots/production/${page}/${viewport}.png"
              local="test/visual/screenshots/local/${page}/${viewport}.png"
              echo "<div class='panel' data-page='${page}' data-viewport='${viewport}'><h2>${page} / ${viewport}</h2><div class='imgs'>" >> test/visual/diff-report.html
              for pair in "Production:$prod" "Local:$local" "Diff:$diff_img"; do
                label="${pair%%:*}"; img="${pair#*:}"
                if [ -f "$img" ]; then
                  name="$(basename "$img" .png)"
                  thumb="${img%/*}/thumbs/${name}.jpg"
                  if [ -f "$thumb" ]; then
                    mime="image/jpeg"
                  else
                    thumb="$img"; mime="image/png"
                  fi
                  b64="$(base64 -w0 "$thumb")"
                  echo "<figure><figcaption>${label}</figcaption><img data-src='data:${mime};base64,${b64}'></figure>" >> test/visual/diff-report.html
                fi
              done
              echo "</div></div>" >> test/visual/diff-report.html
            done
          done
          cat >> test/visual/diff-report.html <<'FOOTER'
          <script>
          const ps=document.getElementById('ps'),vt=document.getElementById('vt');
          const panels=[...document.querySelectorAll('.panel')];
          function selectPage(page){
            ps.value=page;
            vt.innerHTML='';
            const vps=[...new Set(panels.filter(p=>p.dataset.page===page).map(p=>p.dataset.viewport))];
            vps.forEach(vp=>{
              const a=document.createElement('a');a.textContent=vp;a.href='#';
              a.onclick=e=>{e.preventDefault();selectViewport(page,vp);};
              vt.appendChild(a);
            });
            if(vps.length)selectViewport(page,vps[0]);
          }
          function selectViewport(page,viewport){
            panels.forEach(p=>p.classList.remove('active'));
            vt.querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.textContent===viewport));
            const el=panels.find(p=>p.dataset.page===page&&p.dataset.viewport===viewport);
            if(el){
              el.classList.add('active');
              el.querySelectorAll('img[data-src]').forEach(i=>{i.src=i.dataset.src;i.removeAttribute('data-src');});
            }
            history.replaceState(null,'','#'+page+'_'+viewport);
          }
          const h=location.hash.slice(1);
          if(h){const[p,v]=h.split('_');if(p){selectPage(p);if(v)selectViewport(p,v);}}
          else if(ps.options.length)selectPage(ps.value);
          window.addEventListener('hashchange',()=>{const[p,v]=location.hash.slice(1).split('_');if(p)selectPage(p);if(v)selectViewport(p,v);});
          </script></body></html>
          FOOTER

      - name: Upload diff viewer
        if: always()
        id: diff-html
        uses: actions/upload-artifact@v7
        with:
          path: test/visual/diff-report.html
          archive: false

      - name: Comment on PR
        if: always()
        env:
          DIFF_URL: ${{ steps.diff-html.outputs.artifact-url }}
        run: |
          if [ -f test/visual/report.md ]; then
            sed -E "s%\| ([a-z]+) \| ([a-z]+) \|%| [\1](${DIFF_URL}#\1_\2) | \2 |%g" \
              test/visual/report.md > test/visual/report-full.md
          else
            echo "## Visual Regression Report" > test/visual/report-full.md
            echo "" >> test/visual/report-full.md
            echo "_Failed to generate comparison report. Check workflow logs._" >> test/visual/report-full.md
          fi

      - uses: marocchino/sticky-pull-request-comment@v2
        if: always()
        with:
          header: visual-regression
          path: test/visual/report-full.md
