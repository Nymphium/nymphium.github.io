name: update-flake-lock
on:
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: "0 0 1 * *" # runs every month 1st

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            max-jobs = auto
            cores = 0
      - uses: cachix/cachix-action@v17
        with:
          name: blog-ci
          authToken: "${{ secrets.CACHIX_TOKEN }}"
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@fd9359ac79d0e912f1b4b947a48470b3e2799b56 # v27
        with:
          # PRs opened with the default GITHUB_TOKEN don't trigger `on: pull_request`
          # workflows, so `tests` never runs and the PR stays BLOCKED by branch rules.
          # A PAT makes the PR trigger CI normally.
          token: ${{ secrets.BOT_PAT }}
          pr-title: "Update flake.lock" # Title of PR to be created
          pr-labels: | # Labels to be set on the PR
            dependencies
            automated
